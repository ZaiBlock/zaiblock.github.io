<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Generador</title><link rel="stylesheet" href="style.css"></head>
<body>
<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
<main class="glass">
<h1>Generador</h1><p class="sub">Códigos de acceso de un solo uso</p>
<section id="login" class="view on">
 <form id="fa"><label>Correo de administrador</label><input id="em" type="email" required>
 <label>Contraseña</label><input id="pw" type="password" required><button>Entrar</button></form>
</section>
<section id="panel" class="view">
 <button id="gen">Generar código nuevo</button>
 <div class="idbox" id="out" style="font-size:1.5rem;letter-spacing:.15em">—</div>
 <button class="ghost" id="cp">Copiar</button>
</section>
<div class="msg" id="msg"></div>
</main>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,signInWithEmailAndPassword} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,doc,setDoc} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import {firebaseConfig} from "./firebase-config.js";
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
const $=s=>document.querySelector(s),say=(t,ok)=>{$("#msg").textContent=t;$("#msg").className="msg"+(ok?" ok":"")};
$("#fa").onsubmit=async e=>{e.preventDefault();
 try{await signInWithEmailAndPassword(auth,$("#em").value,$("#pw").value);
  $("#login").classList.remove("on");$("#panel").classList.add("on");say("")}
 catch{say("Datos incorrectos.")}};
$("#gen").onclick=async()=>{
 const A="ABCDEFGHJKLMNPQRSTUVWXYZ23456789",r=crypto.getRandomValues(new Uint8Array(10));
 const c=[...r].map(n=>A[n%A.length]).join("");
 try{await setDoc(doc(db,"codes",c),{used:false});$("#out").textContent=c;say("Código creado.",true)}
 catch{say("No tienes permiso (revisa las reglas y tu correo).")}};
$("#cp").onclick=()=>navigator.clipboard.writeText($("#out").textContent).then(()=>say("Copiado.",true));
</script></body></html>
