<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FetoHUB</title><link rel="stylesheet" href="style.css"></head>
<body>
<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
<main class="glass">
<h1>FetoHUB</h1><p class="sub">(cheto hub 2)</p>

<section id="gate" class="view on">
 <form id="fGate"><label for="code">Código de acceso</label>
 <input id="code" autocomplete="off" placeholder="Pega tu código" required>
 <button>Entrar</button></form>
</section>

<section id="auth" class="view">
 <div class="tabs"><button id="tSign">Crear cuenta</button><button id="tLog" class="off">Iniciar sesión</button></div>
 <form id="fSign"><label>Tu ID de usuario (se asigna solo)</label>
  <input id="sid" name="username" autocomplete="username" readonly>
  <label for="spw">Crea una contraseña (mín. 6)</label>
  <input id="spw" type="password" autocomplete="new-password" minlength="6" required>
  <button>Crear cuenta</button></form>
 <form id="fLog" hidden><label for="lid">ID de usuario (4 dígitos)</label>
  <input id="lid" name="username" inputmode="numeric" maxlength="4" autocomplete="username" required>
  <label for="lpw">Contraseña</label>
  <input id="lpw" type="password" autocomplete="current-password" required>
  <button>Iniciar sesión</button></form>
</section>

<section id="welcome" class="view">
 <h2 id="wt">¡Bienvenido!</h2><p id="wp"></p>
 <div class="idbox" id="wid"></div>
 <button class="ghost" id="copy">Copiar ID</button>
 <button class="ghost" id="out">Cerrar sesión</button>
</section>
<div class="msg" id="msg"></div>
</main>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,createUserWithEmailAndPassword,signInWithEmailAndPassword,onAuthStateChanged,signOut,deleteUser} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,doc,getDoc,updateDoc} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import {firebaseConfig} from "./firebase-config.js";
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
const $=s=>document.querySelector(s);
let code=null,busy=false,pid=rid();
function rid(){return String(1000+Math.floor(Math.random()*9000))}
const mail=id=>id+"@fetohub.app";
const show=v=>document.querySelectorAll(".view").forEach(x=>x.classList.toggle("on",x.id===v));
const say=(t,ok)=>{$("#msg").textContent=t;$("#msg").className="msg"+(ok?" ok":"")};
$("#sid").value=pid;

onAuthStateChanged(auth,u=>{ if(busy)return; if(u)welcome(u.email.split("@")[0],false); else show("gate"); });

function welcome(id,isNew){
 $("#wt").textContent=isNew?"¡Bienvenido a FetoHUB!":"¡Qué bueno verte de nuevo!";
 $("#wp").textContent=isNew?"Tu cuenta está lista. Este es tu ID de usuario, guárdalo:":"Sesión iniciada. Tu ID:";
 $("#wid").textContent=id; say(""); show("welcome");
}
async function consume(){ await updateDoc(doc(db,"codes",code),{used:true}); }
function usedAgain(){ code=null; $("#code").value=""; show("gate"); say("Ese código ya fue usado."); }

$("#fGate").onsubmit=async e=>{e.preventDefault();
 const c=$("#code").value.trim().toUpperCase();
 if(!/^[A-Z0-9]{6,20}$/.test(c))return say("Ese código no existe.");
 try{ const s=await getDoc(doc(db,"codes",c));
  if(!s.exists())return say("Ese código no existe.");
  if(s.data().used)return say("Ese código ya fue usado.");
  code=c; say(""); show("auth");
 }catch{ say("No se pudo verificar. Intenta de nuevo."); }
};
$("#tSign").onclick=()=>{$("#fSign").hidden=false;$("#fLog").hidden=true;$("#tSign").className="";$("#tLog").className="off";say("")};
$("#tLog").onclick=()=>{$("#fSign").hidden=true;$("#fLog").hidden=false;$("#tLog").className="";$("#tSign").className="off";say("")};

$("#fSign").onsubmit=async e=>{e.preventDefault();
 const pw=$("#spw").value; busy=true; let u,id=pid;
 try{
  for(let i=0;i<30;i++){
   try{u=(await createUserWithEmailAndPassword(auth,mail(id),pw)).user;break}
   catch(err){ if(err.code!=="auth/email-already-in-use")throw err; id=rid(); }
  }
  if(!u)throw new Error("sin id");
  try{await consume()}catch{ await deleteUser(u); busy=false; return usedAgain(); }
  try{ if(window.PasswordCredential) await navigator.credentials.store(new PasswordCredential({id,password:pw,name:"FetoHUB "+id})); }catch{}
  busy=false; pid=rid(); $("#sid").value=pid; $("#spw").value=""; welcome(id,true);
 }catch{ busy=false; say("No se pudo crear la cuenta. Intenta de nuevo."); }
};
$("#fLog").onsubmit=async e=>{e.preventDefault();
 const id=$("#lid").value.trim(); if(!/^\d{4}$/.test(id))return say("El ID tiene 4 dígitos.");
 busy=true;
 try{ await signInWithEmailAndPassword(auth,mail(id),$("#lpw").value); }
 catch{ busy=false; return say("ID o contraseña incorrectos."); }
 try{await consume()}catch{ await signOut(auth); busy=false; return usedAgain(); }
 busy=false; $("#lpw").value=""; welcome(id,false);
};
$("#copy").onclick=async()=>{try{await navigator.clipboard.writeText($("#wid").textContent);say("ID copiado.",true)}catch{say("Cópialo a mano.")}};
$("#out").onclick=async()=>{await signOut(auth);code=null;say("")};
</script></body></html>
