<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Ultraminimalista</title>
    <!-- Librería de iconos minimalistas (Feather Icons) -->
    <script src="https://unpkg.com/feather-icons"></script>
    <style>
        /* === ESTILOS BASE === */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            cursor: none; /* Ocultamos el cursor por defecto del sistema */
        }

        body {
            /* Fondo azul grisáceo casi imperceptible */
            background-color: #16181d; 
            
            /* Cuadrícula casi transparente */
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 40px 40px; /* Tamaño de los cuadros */
            
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            font-family: system-ui, -apple-system, sans-serif;
            user-select: none;
        }

        /* === CURSOR PERSONALIZADO === */
        .cursor {
            width: 20px;
            height: 20px;
            background-color: black;
            border: 2px solid white;
            border-radius: 50%;
            position: fixed;
            pointer-events: none; /* Permite que los clics pasen a través del cursor */
            z-index: 9999;
            transform: translate(-50%, -50%);
            opacity: 0; /* Empieza oculto hasta que el mouse entra */
            transition: opacity 0.2s ease; /* Transición suave al aparecer/desaparecer */
        }

        /* === CONTENEDOR SUPERIOR (NAV) === */
        .floating-container {
            margin-top: 35px; /* Separado del borde superior */
            background: rgba(30, 33, 40, 0.4);
            backdrop-filter: blur(10px); /* Efecto cristal minimalista */
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 35px; /* Bordes ultra redondeados */
            padding: 15px 40px;
            display: flex;
            gap: 45px; /* Separación entre iconos */
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            z-index: 100;
            height: fit-content;
        }

        /* === ICONOS === */
        .nav-item {
            color: rgba(255, 255, 255, 0.3); /* Color apagado por defecto */
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            /* Transición fluida con curva de rebote (Cubic Bezier) */
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
        }

        .nav-item svg {
            width: 26px;
            height: 26px;
        }

        /* === EFECTO HOVER MANEJADO POR JAVASCRIPT === */
        /* Cambiamos el :hover nativo por una clase para usar la hitbox del cursor visual */
        .nav-item.is-hovered {
            color: #ffffff; /* Se vuelve blanco puro */
            transform: translateY(8px); /* Baja un poco */
            filter: drop-shadow(0 0 15px rgba(255, 255, 255, 0.9)); /* Se ilumina */
        }
    </style>
</head>
<body>

    <!-- Cursor custom -->
    <div class="cursor"></div>

    <!-- Menú superior flotante -->
    <nav class="floating-container">
        <!-- Iconos: Casita + 4 randoms -->
        <a href="#" class="nav-item"><i data-feather="home"></i></a>
        <a href="#" class="nav-item"><i data-feather="compass"></i></a>
        <a href="#" class="nav-item"><i data-feather="cpu"></i></a>
        <a href="#" class="nav-item"><i data-feather="moon"></i></a>
        <a href="#" class="nav-item"><i data-feather="terminal"></i></a>
    </nav>

    <script>
        // Inicializar los iconos de Feather Icons
        feather.replace();

        /* =========================================
           1. LÓGICA DEL CURSOR FLUIDO Y HITBOX VISUAL
           ========================================= */
        const cursor = document.querySelector('.cursor');
        let mouseX = window.innerWidth / 2;
        let mouseY = window.innerHeight / 2;
        let cursorX = mouseX;
        let cursorY = mouseY;
        let currentHoveredElement = null;

        // Rastreamos la posición real del mouse
        document.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
            if (cursor.style.opacity === '0' || cursor.style.opacity === '') {
                cursor.style.opacity = '1';
            }
        });

        // Ocultar el cursor si sale de la ventana
        document.addEventListener('mouseleave', () => {
            cursor.style.opacity = '0';
        });
        document.addEventListener('mouseenter', () => {
            cursor.style.opacity = '1';
        });

        // Bucle de animación ultra suave
        function animateCursor() {
            // Factor incrementado a 0.45 para MÁS fluidez y MENOS retraso
            cursorX += (mouseX - cursorX) * 0.45;
            cursorY += (mouseY - cursorY) * 0.45;

            cursor.style.left = `${cursorX}px`;
            cursor.style.top = `${cursorY}px`;

            // LÓGICA DE HITBOX: Comprobar colisión usando el cursor visual, NO el mouse real
            const elUnderCursor = document.elementFromPoint(cursorX, cursorY);
            const navItem = elUnderCursor ? elUnderCursor.closest('.nav-item') : null;

            if (navItem !== currentHoveredElement) {
                // Quitar hover al salir
                if (currentHoveredElement) {
                    currentHoveredElement.classList.remove('is-hovered');
                }
                // Añadir hover y sonido al entrar
                if (navItem) {
                    navItem.classList.add('is-hovered');
                    playTic();
                }
                currentHoveredElement = navItem;
            }

            requestAnimationFrame(animateCursor);
        }
        animateCursor();

        /* =========================================
           2. SINTETIZADOR DE SONIDOS (Web Audio API)
           ========================================= */
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        // Sonido 1: Tic minimalista (Hover)
        function playTic() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();

            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            oscillator.type = 'sine'; 
            oscillator.frequency.setValueAtTime(900, audioCtx.currentTime);
            oscillator.frequency.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.04);

            gainNode.gain.setValueAtTime(0.05, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.04);

            oscillator.start();
            oscillator.stop(audioCtx.currentTime + 0.04);
        }

        // Sonido 2: "Waw" agudo (Click)
        function playWaw() {
            if (audioCtx.state === 'suspended') audioCtx.resume();

            const oscillator = audioCtx.createOscillator();
            const filter = audioCtx.createBiquadFilter();
            const gainNode = audioCtx.createGain();

            // Usamos onda de sierra para tener armónicos y poder filtrarlos
            oscillator.type = 'sawtooth';
            oscillator.frequency.value = 300; // Tono base
            
            // Filtro Bandpass para el efecto "Waw/Wah"
            filter.type = 'bandpass';
            // Frecuencia que sube muy rápido y luego baja (lo hace "agudo")
            filter.frequency.setValueAtTime(800, audioCtx.currentTime);
            filter.frequency.exponentialRampToValueAtTime(4000, audioCtx.currentTime + 0.08); // Barrido agudo
            filter.frequency.exponentialRampToValueAtTime(1000, audioCtx.currentTime + 0.2);

            // Volumen
            gainNode.gain.setValueAtTime(0, audioCtx.currentTime);
            gainNode.gain.linearRampToValueAtTime(0.1, audioCtx.currentTime + 0.03); // Ataque rápido
            gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2); // Desvanecimiento

            // Conexiones
            oscillator.connect(filter);
            filter.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            oscillator.start();
            oscillator.stop(audioCtx.currentTime + 0.25);
        }

        // Evento de clic en toda la pantalla para el "Waw"
        document.addEventListener('click', playWaw);

    </script>
</body>
</html>
