<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Huxhar</title>
    <!-- Fuente Glacial Indifference -->
    <link href="https://fonts.cdnfonts.com/css/glacial-indifference" rel="stylesheet">
    <!-- Librería de iconos minimalistas (Feather Icons) -->
    <script src="https://unpkg.com/feather-icons"></script>
    <style>
        /* === ESTILOS BASE === */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            cursor: none; /* Ocultamos el cursor por defecto del sistema */
        }

        html {
            scroll-behavior: smooth; /* Desplazamiento suave */
        }

        body {
            /* Fondo azul grisáceo casi imperceptible */
            background-color: #16181d; 
            
            /* Cuadrícula casi transparente */
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 40px 40px;
            
            min-height: 100vh;
            overflow-y: auto; /* Permite scroll vertical */
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: 'Glacial Indifference', system-ui, -apple-system, sans-serif;
            user-select: none;
        }

        /* Scrollbar Minimalista */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #16181d;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
        }

        /* === CURSOR PERSONALIZADO === */
        .cursor {
            width: 20px;
            height: 20px;
            background-color: black;
            border: 2px solid white;
            border-radius: 50%;
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            transform: translate(-50%, -50%);
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        /* === CONTENEDOR SUPERIOR (NAV) === */
        .floating-container {
            margin-top: 35px;
            background: rgba(30, 33, 40, 0.4);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 35px;
            padding: 15px 40px;
            display: flex;
            gap: 45px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            z-index: 100;
            height: fit-content;
        }

        /* === ICONOS === */
        .nav-item {
            color: rgba(255, 255, 255, 0.3);
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
        }

        .nav-item svg {
            width: 26px;
            height: 26px;
        }

        .nav-item:hover {
            color: #ffffff;
            transform: translateY(8px);
            filter: drop-shadow(0 0 15px rgba(255, 255, 255, 0.9));
        }

        /* === CONTENIDO PRINCIPAL === */
        .main-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            margin-top: 60px;
            padding: 0 20px;
            flex: 1;
        }

        .title {
            color: rgba(255, 255, 255, 0.85);
            font-size: 3.8rem;
            font-weight: 700;
            letter-spacing: 16px;
            text-transform: uppercase;
            text-shadow: 0 0 30px rgba(255, 255, 255, 0.1);
        }

        .description {
            margin-top: 15px;
            color: rgba(255, 255, 255, 0.35);
            font-size: 1.1rem;
            letter-spacing: 3px;
            max-width: 500px;
            line-height: 1.6;
        }

        /* Contenedor espaciador para habilitar el scroll suave */
        .scroll-space {
            height: 60vh;
        }

        /* === FOOTER MINIMALISTA === */
        .footer {
            margin-bottom: 30px;
            background: rgba(25, 28, 34, 0.5);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 18px 35px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .copyright {
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.85rem;
            letter-spacing: 1.5px;
        }

        .ai-credit {
            color: rgba(255, 255, 255, 0.25);
            font-size: 0.7rem;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .gemini-logo {
            width: 11px;
            height: 11px;
            fill: rgba(255, 255, 255, 0.35);
        }
    </style>
</head>
<body>

    <!-- Cursor custom -->
    <div class="cursor"></div>

    <!-- Menú superior flotante -->
    <nav class="floating-container">
        <a href="#" class="nav-item"><i data-feather="home"></i></a>
        <a href="#" class="nav-item"><i data-feather="compass"></i></a>
        <a href="#" class="nav-item"><i data-feather="cpu"></i></a>
        <a href="#" class="nav-item"><i data-feather="moon"></i></a>
        <a href="#" class="nav-item"><i data-feather="terminal"></i></a>
    </nav>

    <!-- Contenido Central -->
    <main class="main-content">
        <h1 class="title">Huxhar</h1>
        <p class="description">Centro de herramientas, utilidades, emuladores y proyectos.</p>
    </main>

    <!-- Espacio para permitir el scroll suave -->
    <div class="scroll-space"></div>

    <!-- Footer -->
    <footer class="footer">
        <span class="copyright">Derechos reservados a Sa1xp</span>
        <span class="ai-credit">
            Esta página ha sido creada con ayuda de Gemini
            <svg class="gemini-logo" viewBox="0 0 24 24">
                <path d="M12 0C12 6.627 6.627 12 0 12C6.627 12 12 17.373 12 24C12 17.373 17.373 12 24 12C17.373 12 12 6.627 12 0Z"/>
            </svg>
        </span>
    </footer>

    <script>
        // Inicializar los iconos de Feather Icons
        feather.replace();

        /* =========================================
           1. LÓGICA DEL CURSOR FLUIDO (Lerp a 120fps)
           ========================================= */
        const cursor = document.querySelector('.cursor');
        let mouseX = window.innerWidth / 2;
        let mouseY = window.innerHeight / 2;
        let cursorX = mouseX;
        let cursorY = mouseY;

        document.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
            cursor.style.opacity = '1';
        });

        document.addEventListener('mouseleave', () => {
            cursor.style.opacity = '0';
        });
        document.addEventListener('mouseenter', () => {
            cursor.style.opacity = '1';
        });

        function animateCursor() {
            cursorX += (mouseX - cursorX) * 0.55;
            cursorY += (mouseY - cursorY) * 0.55;

            cursor.style.left = `${cursorX}px`;
            cursor.style.top = `${cursorY}px`;

            requestAnimationFrame(animateCursor);
        }
        animateCursor();

        /* =========================================
           2. SINTETIZADOR DE SONIDOS (Web Audio API)
           ========================================= */
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playTic() {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();

            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            oscillator.type = 'sine'; 
            oscillator.frequency.setValueAtTime(900, audioCtx.currentTime);
            oscillator.frequency.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.04);

            gainNode.gain.setValueAtTime(0.05, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.04);

            oscillator.start();
            oscillator.stop(audioCtx.currentTime + 0.04);
        }

        function playWaw() {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            const oscillator = audioCtx.createOscillator();
            const filter = audioCtx.createBiquadFilter();
            const gainNode = audioCtx.createGain();

            oscillator.type = 'sawtooth';
            oscillator.frequency.setValueAtTime(450, audioCtx.currentTime);

            filter.type = 'bandpass';
            filter.frequency.setValueAtTime(1200, audioCtx.currentTime);
            filter.frequency.exponentialRampToValueAtTime(4800, audioCtx.currentTime + 0.07);
            filter.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.18);

            gainNode.gain.setValueAtTime(0.08, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.18);

            oscillator.connect(filter);
            filter.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            oscillator.start();
            oscillator.stop(audioCtx.currentTime + 0.2);
        }

        /* =========================================
           3. EVENTOS
           ========================================= */
        const navItems = document.querySelectorAll('.nav-item');
        
        navItems.forEach(item => {
            item.addEventListener('mouseenter', () => {
                playTic();
            });
        });

        document.addEventListener('click', playWaw);
    </script>
</body>
</html>
